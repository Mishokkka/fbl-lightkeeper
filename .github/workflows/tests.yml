name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: node --check scripts/module.js
      - run: node --check scripts/logic.js
      - run: node --check scripts/presets.js
      - run: node --check scripts/views.js
      - run: node --check scripts/interface.js
      - run: node --check scripts/runtime.js
      - run: node --check scripts/audio.js
      - run: node --check scripts/ignition.js
      - run: node --check scripts/transport.js
      - run: npm test
