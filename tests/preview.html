<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lightkeeper · UI preview</title>
<link rel="stylesheet" href="/core/fonts/fontawesome/css/all.min.css">
<style>
  *{box-sizing:border-box}body{margin:0;background:#252d34;color:#e3e7e9;font:13px 'Segoe UI',sans-serif;min-height:100vh}
  body.theme-light{background:#ede8df;color:#263138}body.theme-light .application :is(input,select,textarea){background:#fff;color:#111;border-color:#bbb}
  body.theme-light .application button{background:#eee;color:#222}body.theme-light .application h2{color:#222}
  .demo-bar{position:fixed;z-index:1000;top:0;left:0;right:0;background:#10181f;color:#d3dbe0;display:flex;gap:12px;padding:12px 24px;align-items:center;border-bottom:1px solid #596970}
  .demo-bar strong{margin-right:auto;color:#d6af70;letter-spacing:.1em}.demo-bar button{background:#263740;color:#e3e7e9;border:1px solid #60747f;border-radius:5px;padding:7px 12px;cursor:pointer}
  .application{position:absolute;display:flex;flex-direction:column}.window-header{display:flex;align-items:center;gap:8px;min-height:36px}.window-title{flex:1}.window-content{flex:1;min-height:0}
  .demo-toasts{position:fixed;z-index:2000;bottom:12px;left:12px;display:flex;flex-direction:column;gap:4px}.demo-toast{background:#172b32;color:#ffe0aa;border:1px solid #9a8054;border-radius:6px;padding:10px 14px;max-width:450px}
</style>
<link rel="stylesheet" href="../styles/lightkeeper.css"></head><body>
<nav class="demo-bar"><strong>LIGHTKEEPER / ПРЕВЬЮ</strong><button id="demo-light">Светлая тема Foundry</button><button id="demo-panel">Панель</button><button id="demo-library">Библиотека</button><button id="demo-pause">Пауза мира</button></nav>
<div class="demo-toasts"></div><script type="module" src="/tests/preview.js"></script></body></html>
